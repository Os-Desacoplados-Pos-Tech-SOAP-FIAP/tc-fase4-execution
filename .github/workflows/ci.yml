name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest

    services:
      localstack:
        image: localstack/localstack:3.8
        env:
          SERVICES: dynamodb,sns,sqs
          AWS_DEFAULT_REGION: us-east-1
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o Sonar usa o histórico para identificar o código novo

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dependências
        run: npm ci

      # O container de serviço sobe antes do checkout, então o script de init roda aqui.
      - name: Topologia LocalStack (DynamoDB/SNS/SQS)
        run: docker exec -i ${{ job.services.localstack.id }} bash < docker/localstack/init-execution.sh

      - name: Lint
        run: npm run lint:ci

      - name: Build
        run: npm run build

      - name: Testes (unit + integração + e2e) com cobertura ≥ 80%
        run: npm run test:cov

      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn

      - name: Imagem Docker
        run: docker build -f docker/Dockerfile -t tc-fase4-execution:ci .

      - name: SonarCloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
