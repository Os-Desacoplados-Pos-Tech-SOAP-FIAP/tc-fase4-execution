sonar.organization=os-desacoplados-pos-tech-soap-fiap
sonar.projectKey=Os-Desacoplados-Pos-Tech-SOAP-FIAP_tc-fase4-execution
sonar.projectName=tc-fase4-execution

sonar.sources=src
sonar.tests=src,test
sonar.exclusions=src/**/*.spec.ts
sonar.test.inclusions=src/**/*.spec.ts,test/**/*.ts

# Mesmas exclusões do collectCoverageFrom do jest.config.ts
sonar.coverage.exclusions=src/main.ts,src/tracing.ts,src/**/*.module.ts,src/**/dto/**
sonar.cpd.exclusions=src/**/dto/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.qualitygate.wait=true

# Regras ignoradas de propósito:
# e1 - S2699 nos e2e: as asserções são o .expect(status) do supertest, que a regra não reconhece.
# e2 - S7718: pede o parâmetro do catch com nome em inglês (error); o projeto usa pt-BR (erro).
# e3 - S9382: awaits sequenciais são intencionais (ordem FIFO por OS e leituras antes da
#      unidade de trabalho, que envia as escritas num único TransactWriteItems).
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2699
sonar.issue.ignore.multicriteria.e1.resourceKey=test/e2e/**/*.ts
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S7718
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*
