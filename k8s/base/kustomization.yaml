apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Aplicado a todos os recursos namespaced. O Namespace é cluster-scoped e é ignorado.
namespace: execution

# ConfigMap execution-config e Secret execution-secret NÃO estão aqui: o CD os cria a
# partir dos outputs do Terraform e do Secrets Manager (nada sensível no Git).
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# O CD troca pela imagem do ECR com `kustomize edit set image execution=<ecr>:<sha>`.
images:
  - name: execution
    newName: execution
    newTag: latest
